
<!DOCTYPE html>
<html lang="ja">
<head>

<title>かたちあつめいろあつめ - まちのなかをよくみるアプリ | 街なかSOSつき</title>
<meta name="description" content="電車や街歩き中に形をさがす知育アプリ。写真・位置情報は使わず、多言語の街なかSOS機能つき。" />
<meta name="theme-color" content="#1C7C8C" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="かたちあつめいろあつめ" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

<script>
  /* ---- Boot watchdog: if the app fails to mount (CDN blocked, script
     error, slow network on a real device, etc.) show a visible retry
     screen instead of leaving a blank white page. Must be defined
     BEFORE any CDN script tag so it can catch load failures too. ---- */
  window.__katairoBooted = false;
  window.showBootError = function(reason){
    if(window.__katairoBooted) return;
    try{
      var root = document.getElementById('root');
      if(!root) return;
      root.innerHTML =
        '<div style="max-width:420px;margin:3.5rem auto;padding:1.5rem;text-align:center;' +
        'font-family:-apple-system,BlinkMacSystemFont,\'Hiragino Sans\',sans-serif;color:#23282A;">' +
        '<p style="font-size:2.2rem;margin:0 0 0.6rem;">😥</p>' +
        '<p style="font-weight:700;font-size:1.05rem;margin:0 0 0.5rem;">読み込みに失敗しました</p>' +
        '<p style="font-size:0.85rem;color:#5B6265;margin:0 0 1.2rem;line-height:1.6;">' +
        '通信状況をご確認のうえ、下のボタンでもう一度お試しください。<br>くり返し発生する場合は時間をおいてお試しください。</p>' +
        '<button onclick="location.reload()" style="min-height:44px;padding:0 1.3rem;border-radius:999px;' +
        'border:none;background:#1C7C8C;color:#fff;font-weight:700;font-size:0.9rem;cursor:pointer;">再読み込み</button>' +
        '</div>';
    }catch(e){}
  };
  window.addEventListener('error', function(e){ window.showBootError(e && e.message); });
  window.addEventListener('unhandledrejection', function(e){ window.showBootError('promise'); });
  setTimeout(function(){ window.showBootError('timeout'); }, 15000);
</script>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js" crossorigin="anonymous"></script>

<style>
  :root{
    --bg: #F5F6F0;
    --surface: #FFFFFF;
    --surface-alt: #EBEEE3;
    --ink: #23282A;
    --ink-soft: #5B6265;
    --line: #DCDED4;

    --maru: #1C7C8C;
    --maru-dark: #145867;
    --sankaku: #E2672B;
    --sankaku-dark: #B24E1F;
    --shikaku: #5B4E8C;
    --shikaku-dark: #423669;
    --aachi: #C9A227;
    --aachi-dark: #9C7D1B;
    --hoshi: #C2478D;
    --hoshi-dark: #8F3268;
    --hishigata: #6B8F5A;
    --hishigata-dark: #4C6B3E;

    --sos: #D6483A;
    --sos-dark: #A9382D;

    --font-display: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', sans-serif;
    --font-body: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Noto Sans JP', sans-serif;

    --radius-badge: 999px;
    --radius-card: 22px;
    --radius-tile: 20px;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    min-height: 100dvh;
  }
  h1,h2,h3, .display{ font-family: var(--font-display); }

  button{ font-family: inherit; }
  button:focus-visible, [tabindex]:focus-visible, a:focus-visible, input:focus-visible{
    outline: 3px solid #1C7C8C;
    outline-offset: 2px;
  }

  ::-webkit-scrollbar{ width: 8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 10px; }

  .app-shell{
    max-width: 600px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    position: relative;
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }

  /* ---- Header ---- */
  .app-header{
    position: sticky; top:0; z-index: 30;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 0.65rem 0.85rem;
  }
  .brand-row{ display:flex; align-items:center; justify-content: space-between; gap: 0.5rem; }
  .brand{ display:flex; align-items:center; gap:0.5rem; min-width:0; }
  .brand-badge{
    display:flex; align-items:center; justify-content:center;
    flex-shrink: 0;
  }
  .brand-logo{
    height: 36px;
    width: auto;
    object-fit: contain;
    display: block;
  }
  .brand-title{ font-family: var(--font-display); font-weight:800; font-size: 1.02rem; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .brand-sub{ font-size: 0.68rem; color: var(--ink-soft); }

  .icon-btn{
    min-width:44px; min-height:44px; border-radius: var(--radius-badge);
    display:flex; align-items:center; justify-content:center;
    border: 1.5px solid var(--line); background: var(--surface);
    font-size: 1.15rem; cursor:pointer; transition: transform .12s ease, background .15s ease;
  }
  .icon-btn:active{ transform: scale(0.92); }
  .icon-btn:disabled{ opacity:0.4; cursor:not-allowed; }

  .sos-btn{
    background: var(--sos); color:#fff; border-color: var(--sos-dark);
    font-weight: 800; font-family: var(--font-display);
    padding: 0 0.85rem; min-height: 44px; border-radius: var(--radius-badge);
    display:flex; align-items:center; gap:0.35rem; font-size:0.85rem;
    box-shadow: 0 3px 0 var(--sos-dark);
    border: none;
  }
  .sos-btn:active{ transform: translateY(2px); box-shadow:none; }

  /* ---- profile pills ---- */
  .profile-row{ display:flex; gap:0.4rem; margin-top:0.6rem; overflow-x:auto; padding-bottom:2px; }
  .profile-pill{
    flex-shrink:0; min-height:40px; padding: 0 0.9rem; border-radius: var(--radius-badge);
    border: 1.5px solid var(--line); background: var(--surface-alt);
    font-weight:700; font-size:0.85rem; color: var(--ink-soft);
    display:flex; align-items:center; gap:0.3rem; cursor:pointer;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .profile-pill.active{
    background: var(--ink); color:#fff; border-color: var(--ink);
  }
  .profile-pill .check{ font-size:0.75rem; }

  /* ---- safety strip ---- */
  .safety-strip{
    background: var(--surface-alt);
    color: var(--ink-soft);
    font-size: 0.72rem;
    padding: 0.4rem 0.85rem;
    display:flex; align-items:center; justify-content:space-between; gap:0.5rem;
    border-bottom: 1px solid var(--line);
  }
  .safety-strip button{
    background:none; border:none; color: var(--maru-dark); font-weight:700; font-size:0.72rem;
    text-decoration: underline; cursor:pointer; min-height:32px; flex-shrink:0;
  }

  /* ---- main ---- */
  main{ flex:1; padding: 1rem 0.85rem 2rem; }

  .greet{ margin-bottom: 0.9rem; }
  .greet-name{ font-family: var(--font-display); font-weight:800; font-size:1.35rem; }
  .greet-tone{ font-size:0.78rem; color: var(--ink-soft); margin-top:0.15rem; }

  .shape-grid{
    display:grid; grid-template-columns: 1fr 1fr; gap: 0.7rem;
  }
  .shape-tile{
    position: relative;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: var(--radius-tile);
    padding: 0.9rem 0.6rem 0.7rem;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height: 140px;
    cursor:pointer;
    box-shadow: 0 2px 0 rgba(0,0,0,0.04);
    transition: transform .08s ease;
    user-select:none;
  }
  .shape-tile:active{ transform: scale(0.96); }
  .shape-tile .count-chip{
    position:absolute; top:0.5rem; right:0.5rem;
    min-width: 30px; height: 26px; padding: 0 0.4rem;
    border-radius: var(--radius-badge);
    color:#fff; font-weight:800; font-size:0.8rem; font-family: var(--font-display);
    display:flex; align-items:center; justify-content:center;
  }
  .shape-tile .icon-wrap{ width:56px; height:56px; display:flex; align-items:center; justify-content:center; margin-bottom:0.35rem; }
  .shape-tile .shape-label{ font-weight:700; font-size:0.85rem; color: var(--ink); }
  .shape-tile.pulse{ animation: tilePulse 0.42s ease; }
  @keyframes tilePulse{
    0%{ transform: scale(1); }
    35%{ transform: scale(1.08); }
    100%{ transform: scale(1); }
  }
  .ring-burst{
    position:absolute; inset:0; border-radius: var(--radius-tile);
    border: 3px solid transparent; pointer-events:none;
  }
  .ring-burst.show{ animation: ringBurst 0.5s ease-out; }
  @keyframes ringBurst{
    0%{ box-shadow: 0 0 0 0 rgba(0,0,0,0.18); }
    100%{ box-shadow: 0 0 0 10px rgba(0,0,0,0); }
  }

  .stats-card{
    margin-top: 1rem; background: var(--surface); border:1.5px solid var(--line);
    border-radius: var(--radius-card); padding: 1rem;
  }
  .stats-total{ display:flex; align-items:baseline; gap:0.4rem; justify-content:center; margin-bottom:0.85rem; }
  .stats-total b{ font-family: var(--font-display); font-size: 1.9rem; color: var(--maru-dark); }
  .stats-total span{ font-size: 0.85rem; color: var(--ink-soft); }

  .btn{
    min-height: 48px; border-radius: var(--radius-badge); border:none; cursor:pointer;
    font-weight:800; font-family: var(--font-display); font-size:0.92rem;
    display:flex; align-items:center; justify-content:center; gap:0.4rem;
    transition: transform .1s ease, opacity .15s ease;
  }
  .btn:active{ transform: scale(0.97); }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .btn-primary{ background: var(--maru); color:#fff; box-shadow: 0 3px 0 var(--maru-dark); }
  .btn-primary:active:not(:disabled){ box-shadow:none; transform: translateY(3px) scale(0.99); }
  .btn-secondary{ background: var(--surface-alt); color: var(--ink); border:1.5px solid var(--line); }
  .btn-undo{ width:100%; margin-bottom:0.6rem; font-size:0.85rem; }
  .btn-row{ display:flex; gap:0.6rem; }
  .btn-row .btn{ flex:1; }

  /* ---- footer ---- */
  footer{ margin-top: auto; }

  /* ---- toast ---- */
  .faceup-toast{
    position: fixed; top: 0.7rem; left:50%; transform: translateX(-50%) translateY(-140%);
    max-width: 560px; width: calc(100% - 1.4rem);
    background: var(--ink); color:#fff; border-radius: 16px;
    padding: 0.7rem 0.9rem; display:flex; align-items:center; gap:0.6rem;
    z-index: 80; box-shadow: 0 8px 24px rgba(0,0,0,0.22);
    transition: transform .35s cubic-bezier(.34,1.3,.64,1);
  }
  .faceup-toast.show{ transform: translateX(-50%) translateY(0); }
  .faceup-toast p{ font-size:0.82rem; line-height:1.4; margin:0; flex:1; }
  .faceup-toast .close-x{ background:rgba(255,255,255,0.15); border:none; color:#fff; width:30px; height:30px; border-radius:50%; flex-shrink:0; cursor:pointer; font-size:0.9rem; }

  /* ---- modal ---- */
  .modal-overlay{
    position: fixed; inset:0; background: rgba(20,20,18,0.5);
    display:flex; align-items:flex-end; justify-content:center; z-index: 100;
    padding: 0;
  }
  @media (min-width: 640px){
    .modal-overlay{ align-items:center; padding: 1rem; }
  }
  .modal-sheet{
    background: var(--surface); width:100%; max-width:600px;
    border-radius: 24px 24px 0 0;
    max-height: 92vh; overflow-y:auto;
    padding: 1.1rem 1.1rem 1.4rem;
    animation: sheetUp .28s cubic-bezier(.32,.72,0,1);
    padding-bottom: calc(1.4rem + env(safe-area-inset-bottom));
  }
  @media (min-width: 640px){
    .modal-sheet{ border-radius: 24px; max-height: 88vh; }
  }
  @keyframes sheetUp{ from{ transform: translateY(24px); opacity:0; } to{ transform: translateY(0); opacity:1; } }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:0.9rem; }
  .modal-title{ font-family: var(--font-display); font-weight:800; font-size:1.1rem; }

  .segmented{ display:flex; background: var(--surface-alt); border-radius: var(--radius-badge); padding:4px; gap:2px; flex-wrap:wrap; }
  .segmented button{
    flex:1; border:none; background:transparent; padding: 0.55rem 0.3rem; border-radius: var(--radius-badge);
    font-weight:700; font-size: 0.8rem; color: var(--ink-soft); cursor:pointer; min-height:40px; min-width:64px;
  }
  .segmented button.active{ background: var(--ink); color:#fff; }

  .field-group{ margin-bottom: 1.1rem; }
  .field-label{ font-weight:800; font-size:0.85rem; margin-bottom:0.5rem; display:flex; align-items:center; gap:0.35rem; }
  .field-hint{ font-size:0.72rem; color: var(--ink-soft); margin-top:0.4rem; }

  .swatch-row{ display:flex; gap:0.5rem; flex-wrap:wrap; }
  .swatch{
    padding: 0.5rem 0.8rem; border-radius: var(--radius-badge); border: 2px solid var(--line);
    display:flex; align-items:center; gap:0.4rem; cursor:pointer; font-weight:700; font-size:0.8rem; background:#fff;
    min-height:44px;
  }
  .swatch.active{ border-color: var(--ink); background: var(--surface-alt); }
  .swatch-dots{ display:flex; }
  .swatch-dots i{ width:12px; height:12px; border-radius:50%; margin-left:-4px; border:1.5px solid #fff; display:inline-block; }
  .swatch-dots i:first-child{ margin-left:0; }

  .custom-color-swatch{
    display:flex; align-items:center; gap:0.5rem; padding:0.5rem 0.8rem 0.5rem 0.5rem;
    border-radius: var(--radius-badge); border:2px solid var(--line); background:#fff;
    min-height:44px; cursor:pointer; font-weight:700; font-size:0.8rem;
  }
  .custom-color-swatch.active{ border-color: var(--ink); background: var(--surface-alt); }
  .custom-color-swatch input[type=color]{
    width:28px; height:28px; border:none; padding:0; border-radius:50%; overflow:hidden;
    cursor:pointer; background:none; flex-shrink:0;
  }
  .custom-color-swatch input[type=color]::-webkit-color-swatch-wrapper{ padding:0; border-radius:50%; }
  .custom-color-swatch input[type=color]::-webkit-color-swatch{ border:1.5px solid var(--line); border-radius:50%; }

  .art-canvas-wrap{ border-radius: 18px; overflow:hidden; border:1.5px solid var(--line); background: var(--surface-alt); margin-bottom: 0.9rem; }
  .art-canvas-wrap canvas{ width:100%; height:auto; display:block; }

  .gallery-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:0.5rem; }
  .gallery-item{ position:relative; border-radius:14px; overflow:hidden; border:1.5px solid var(--line); aspect-ratio:1/1; cursor:pointer; background: var(--surface-alt); }
  .gallery-item img{ width:100%; height:100%; object-fit:cover; display:block; }
  .gallery-empty{ text-align:center; padding: 2rem 1rem; color: var(--ink-soft); font-size:0.85rem; }

  .manner-list{ display:flex; flex-direction:column; gap:0.6rem; margin: 0.9rem 0 1rem; }
  .manner-item{ display:flex; gap:0.6rem; align-items:flex-start; background: var(--surface-alt); padding:0.7rem; border-radius:14px; }
  .manner-item .em{ font-size:1.3rem; line-height:1; flex-shrink:0; }
  .manner-item p{ margin:0; font-size:0.85rem; line-height:1.5; }
  .step-num{
    width:28px; height:28px; border-radius:50%; background: var(--maru); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:800;
    font-family: var(--font-display); font-size:0.85rem; flex-shrink:0;
  }

  .install-banner{
    position: fixed; bottom: 0.7rem; left:50%; transform: translateX(-50%);
    width: calc(100% - 1.4rem); max-width: 560px;
    background: var(--surface); border:1.5px solid var(--line); border-radius: 16px;
    padding: 0.75rem 0.8rem; padding-bottom: calc(0.75rem + env(safe-area-inset-bottom));
    box-shadow: 0 8px 24px rgba(0,0,0,0.16);
    z-index: 70; display:flex; align-items:center; gap:0.6rem;
  }
  .install-icon{ font-size:1.4rem; flex-shrink:0; }
  .install-banner .txt{ flex:1; font-size:0.76rem; line-height:1.4; color: var(--ink); }
  .install-banner .actions{ display:flex; align-items:center; gap:0.4rem; flex-shrink:0; }

  /* ---- profile management ---- */
  .profile-manage-list{ display:flex; flex-direction:column; gap:0.5rem; margin-bottom:0.7rem; }
  .profile-manage-item{
    display:flex; align-items:center; gap:0.4rem; background: var(--surface-alt);
    padding: 0.45rem 0.5rem 0.45rem 0.8rem; border-radius: 14px; min-height:48px;
  }
  .profile-manage-name{ flex:1; font-weight:700; font-size:0.85rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .profile-add-row{ display:flex; gap:0.5rem; }
  .text-input{
    flex:1; min-height:44px; border-radius: 12px; border:1.5px solid var(--line);
    padding: 0 0.7rem; font-size:0.85rem; font-family: inherit; color: var(--ink); background:#fff; min-width:0;
  }

  /* ---- SOS ---- */
  .sos-lang-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:0.6rem; }
  .sos-lang-btn{
    border:1.5px solid var(--line); background:#fff; border-radius:16px; padding:0.9rem 0.6rem;
    display:flex; flex-direction:column; align-items:center; gap:0.3rem; cursor:pointer; min-height:70px;
  }
  .sos-lang-btn .flag{ font-size:1.6rem; }
  .sos-lang-btn .lbl{ font-weight:700; font-size:0.85rem; }

  .sos-cat-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:0.6rem; }
  .sos-cat-btn{
    border:1.5px solid var(--line); background:#fff; border-radius:16px; padding:1rem 0.6rem;
    display:flex; flex-direction:column; align-items:center; gap:0.4rem; cursor:pointer; min-height:100px; text-align:center;
  }
  .sos-cat-btn .em{ font-size:2rem; }
  .sos-cat-btn .lbl{ font-weight:800; font-size:0.82rem; line-height:1.3; }
  .sos-cat-btn .lbl-sub{ font-size:0.68rem; color: var(--ink-soft); }

  .sos-question-card{ background: var(--surface-alt); border-radius:18px; padding:1.1rem; text-align:center; margin-bottom:1rem; }
  .sos-question-card .em{ font-size:2.2rem; }
  .sos-question-card p{ font-weight:800; font-size:1.02rem; margin: 0.5rem 0 0.2rem; }
  .sos-question-card .sub{ font-size:0.8rem; color: var(--ink-soft); font-weight:500; }

  .sos-answer-row{ display:flex; flex-direction:column; gap:0.55rem; }
  .sos-answer-btn{
    min-height:52px; border-radius:16px; border:1.5px solid var(--line); background:#fff;
    font-weight:800; font-size:0.95rem; cursor:pointer;
  }

  .sos-result-card{
    border-radius:20px; padding:1.2rem; color:#fff; background: linear-gradient(160deg, var(--maru), var(--maru-dark));
    text-align:center; margin-bottom:1rem;
  }
  .sos-result-card .badge{ background: rgba(255,255,255,0.2); display:inline-block; padding:0.25rem 0.7rem; border-radius:var(--radius-badge); font-size:0.7rem; font-weight:700; margin-bottom:0.6rem; }
  .sos-result-card .phrase-main{ font-size:1.15rem; font-weight:800; line-height:1.5; margin-bottom:0.5rem; }
  .sos-result-card .phrase-sub{ font-size:0.85rem; opacity:0.92; line-height:1.5; margin-bottom:0.7rem; }
  .sos-result-card .note{ font-size:0.75rem; background: rgba(255,255,255,0.15); border-radius:12px; padding:0.6rem; line-height:1.5; }

  .emergency-row{ display:flex; gap:0.5rem; }
  .emergency-chip{ flex:1; background: var(--surface-alt); border-radius:14px; padding:0.6rem; text-align:center; }
  .emergency-chip b{ display:block; font-family: var(--font-display); font-size:1.15rem; color: var(--sos-dark); }
  .emergency-chip span{ font-size:0.68rem; color: var(--ink-soft); }

  .step-back{ background:none; border:none; color: var(--ink-soft); font-weight:700; font-size:0.82rem; cursor:pointer; display:flex; align-items:center; gap:0.2rem; min-height:40px; }

  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

  /* ---- calendar collection ---- */

   ============================================================ */
const memoryStore = {};
const safeStorage = {
  get(key, fallback){
    try{
      const raw = window.localStorage.getItem(key);
      if(raw === null || raw === undefined) return fallback;
      return JSON.parse(raw);
    }catch(e){
      return Object.prototype.hasOwnProperty.call(memoryStore, key) ? memoryStore[key] : fallback;
    }
  },
  set(key, value){
    memoryStore[key] = value;
    try{
      window.localStorage.setItem(key, JSON.stringify(value));
      return true;
    }catch(e){
      return false;
    }
  },
  remove(key){
    delete memoryStore[key];
    try{
      window.localStorage.removeItem(key);
      return true;
    }catch(e){
      return false;
    }
  }
};

const WEEKDAYS_JA = ['日','月','火','水','木','金','土'];
function pad2(n){ return n < 10 ? '0'+n : ''+n; }
function dateKeyFromTs(ts){
  const d = new Date(ts);
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}

function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const bigint = parseInt(h.length===3 ? h.split('').map(c=>c+c).join('') : h, 16);
  const r = (bigint>>16)&255, g=(bigint>>8)&255, b=bigint&255;
  return `rgba(${r},${g},${b},${alpha})`;
}

function hexToHsl(hex){
  let h = hex.replace('#','');
  if(h.length===3) h = h.split('').map(c=>c+c).join('');
  const r = parseInt(h.substr(0,2),16)/255;
  const g = parseInt(h.substr(2,2),16)/255;
  const b = parseInt(h.substr(4,2),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let hh = 0, s = 0;
  const l = (max+min)/2;
  if(max !== min){
    const d = max-min;
    s = l > 0.5 ? d/(2-max-min) : d/(max+min);
    if(max === r) hh = (g-b)/d + (g<b ? 6 : 0);
    else if(max === g) hh = (b-r)/d + 2;
    else hh = (r-g)/d + 4;
    hh *= 60;
  }
  return { h: hh, s: s*100, l: l*100 };
}

function hslToHex(h, s, l){
  h = ((h % 360) + 360) % 360;
  s = Math.max(0, Math.min(100, s)) / 100;
  l = Math.max(0, Math.min(100, l)) / 100;
  const c = (1 - Math.abs(2*l - 1)) * s;
  const x = c * (1 - Math.abs(((h/60) % 2) - 1));
  const m = l - c/2;
  let r=0, g=0, b=0;
  if(h < 60){ r=c; g=x; b=0; }
  else if(h < 120){ r=x; g=c; b=0; }
  else if(h < 180){ r=0; g=c; b=x; }
  else if(h < 240){ r=0; g=x; b=c; }
  else if(h < 300){ r=x; g=0; b=c; }
  else { r=c; g=0; b=x; }
  function toHex(v){
    const n = Math.round((v+m)*255);
    const s2 = n.toString(16);
    return s2.length === 1 ? '0'+s2 : s2;
  }
  return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
}

function paletteFromBase(hex){
  try{
    const hsl = hexToHsl(hex);
    const h = hsl.h, s = hsl.s, l = hsl.l;
    return [
      hslToHex(h, s, l),
      hslToHex(h+22, Math.max(25,s-6), Math.min(85,l+14)),
      hslToHex(h-22, Math.min(100,s+4), Math.max(18,l-12)),
      hslToHex(h+180, Math.max(18,s-22), Math.min(78,l+6)),
      hslToHex(h+45, Math.max(20,s-4), Math.min(88,l+22)),
      hslToHex(h-45, Math.min(100,s+2), Math.max(15,l-20)),
    ];
  }catch(e){
    return PALETTES.pop.colors;
  }
}

function drawShape(ctx, shapeId, x, y, r, color, alpha, rot){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.fillStyle = color;
  if(shapeId === 'maru'){
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
  } else if(shapeId === 'sankaku'){
    ctx.beginPath();
    ctx.moveTo(0,-r); ctx.lineTo(r*0.87, r*0.6); ctx.lineTo(-r*0.87, r*0.6); ctx.closePath(); ctx.fill();
  } else if(shapeId === 'shikaku'){
    const s = r*1.5;
    ctx.beginPath();
    const rr = s*0.18;
    ctx.moveTo(-s/2+rr, -s/2);
    ctx.arcTo(s/2,-s/2, s/2,s/2, rr);
    ctx.arcTo(s/2,s/2, -s/2,s/2, rr);
    ctx.arcTo(-s/2,s/2, -s/2,-s/2, rr);
    ctx.arcTo(-s/2,-s/2, s/2,-s/2, rr);
    ctx.closePath(); ctx.fill();
  } else if(shapeId === 'aachi'){
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI,false); ctx.closePath(); ctx.fill();
  } else if(shapeId === 'hoshi'){
    const outerR = r, innerR = r*0.46, spikes = 5;
    const step = Math.PI / spikes;
    let angle = -Math.PI/2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(angle)*outerR, Math.sin(angle)*outerR);
    for(let k=0;k<spikes;k++){
      angle += step;
      ctx.lineTo(Math.cos(angle)*innerR, Math.sin(angle)*innerR);
      angle += step;
      ctx.lineTo(Math.cos(angle)*outerR, Math.sin(angle)*outerR);
    }
    ctx.closePath(); ctx.fill();
  } else if(shapeId === 'hishigata'){
    const w = r*0.82, h = r*1.15;
    ctx.beginPath();
    ctx.moveTo(0,-h); ctx.lineTo(w,0); ctx.lineTo(0,h); ctx.lineTo(-w,0); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function generateArt(canvas, counts, paletteColors){
  const size = canvas.width;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,size,size);

  const bgGrad = ctx.createLinearGradient(0,0,size,size);
  bgGrad.addColorStop(0, hexToRgba(paletteColors[0], 0.18));
  bgGrad.addColorStop(1, hexToRgba(paletteColors[3] || paletteColors[0], 0.18));
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0,0,size,size);
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0,0,size,size);

  const total = SHAPES.reduce((sum,s) => sum + (counts[s.id]||0), 0);
  if(total <= 0) return false;

  const totalDraws = 80;
  const seedBase = Date.now();
  let seed = seedBase % 100000;
  function rand(){ seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }

  SHAPES.forEach((shape, i) => {
    const ratio = (counts[shape.id]||0) / total;
    const n = counts[shape.id] > 0 ? Math.max(4, Math.round(ratio * totalDraws)) : 0;
    const color = paletteColors[i % paletteColors.length];
    for(let j=0;j<n;j++){
      const x = rand()*size;
      const y = rand()*size;
      const r = size*0.035 + rand()*size*0.09;
      const alpha = 0.5 + rand()*0.4;
      const rot = rand()*Math.PI*2;
      drawShape(ctx, shape.id, x, y, r, color, alpha, rot);
    }
  });
  return true;
}

/* ============================================================
   PROFILE MANAGER (inside settings)
   ============================================================ */
function ProfileManager({ profiles, currentProfile, onAdd, onRename, onDelete }){
  const [newName, setNewName] = useState('');
  const [editingId, setEditingId] = useState(null);
  const [editValue, setEditValue] = useState('');
  const [msg, setMsg] = useState('');

  function submitAdd(){
    const res = onAdd(newName);
    if(res.ok){ setNewName(''); setMsg(''); } else { setMsg(res.msg); }
  }
  function startEdit(name){ setEditingId(name); setEditValue(name); setMsg(''); }
  function submitEdit(){
    const res = onRename(editingId, editValue);
    if(res.ok){ setEditingId(null); setMsg(''); } else { setMsg(res.msg); }
  }
  function handleDelete(name){
    const res = onDelete(name);
    if(!res.ok){ setMsg(res.msg); }
  }

  return (
    <div className="field-group">
      <div className="field-label">👤 プロフィールの かんり</div>
      <div className="profile-manage-list">
        {profiles.map(p => (
          <div className="profile-manage-item" key={p}>
            {editingId === p ? (
              <React.Fragment>
                <input
                  className="text-input"
                  value={editValue}
                  onChange={(e)=>setEditValue(e.target.value)}
                  maxLength={8}
                  aria-label="なまえを へんこう"
                  autoFocus
                />
                <button className="icon-btn" aria-label="ほぞんする" onClick={submitEdit}>✓</button>
                <button className="icon-btn" aria-label="へんこうを やめる" onClick={()=>setEditingId(null)}>✕</button>
              </React.Fragment>
            ) : (
              <React.Fragment>
                <span className="profile-manage-name">{p}{p===currentProfile ? '（つかいちゅう）' : ''}</span>
                <button className="icon-btn" aria-label={`${p}の なまえを へんこう`} onClick={()=>startEdit(p)}>✏️</button>
                <button className="icon-btn" aria-label={`${p}を さくじょ`} onClick={()=>handleDelete(p)} disabled={profiles.length<=1}>🗑</button>
              </React.Fragment>
            )}
          </div>
        ))}
      </div>
      <div className="profile-add-row">
        <input
          className="text-input"
          value={newName}
          onChange={(e)=>setNewName(e.target.value)}
          placeholder="あたらしい なまえ"
          maxLength={8}
          aria-label="あたらしいプロフィールのなまえ"
        />
        <button className="btn btn-secondary" onClick={submitAdd}>＋ ついか</button>
      </div>
      {msg && <p className="field-hint" style={{color:'var(--sos-dark)'}}>{msg}</p>}
      {profiles.length<=1 && !msg && <p className="field-hint">さいごの ひとりは さくじょできません。</p>}
    </div>
  );
}

/* ============================================================
   ART / CARD MODAL
   ============================================================ */
function ArtModal({ counts, profile, onClose, onSaveToGallery, onReset }){
  const canvasRef = useRef(null);
  const [paletteKey, setPaletteKey] = useState('pop');
  const [customHex, setCustomHex] = useState('#1C7C8C');
  const [hasArt, setHasArt] = useState(false);
  const [shareMsg, setShareMsg] = useState('');

  const activeColors = useMemo(() => {
    return paletteKey === 'custom' ? paletteFromBase(customHex) : PALETTES[paletteKey].colors;
  }, [paletteKey, customHex]);

  const render = useCallback(() => {
    const canvas = canvasRef.current;
    if(!canvas) return;
    const ok = generateArt(canvas, counts, activeColors);
    setHasArt(ok);
  }, [counts, activeColors]);

  useEffect(() => { render(); }, [render]);

  function handleSavePng(){
    const canvas = canvasRef.current;
    if(!canvas || !hasArt) return;
    try{
      canvas.toBlob((blob) => {
        if(!blob) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `katairo-card-${Date.now()}.png`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(()=>URL.revokeObjectURL(url), 2000);
      }, 'image/png');
    }catch(e){ setShareMsg('ほぞんできませんでした。もう一度 おためしください。'); }
  }

  function handleAddToGallery(){
    const canvas = canvasRef.current;
    if(!canvas || !hasArt) return;
    try{
      // The gallery grid shows each thumbnail at roughly 100-200 CSS px.
      // On a high-DPR (Retina) phone, that many *physical* pixels is 2x-3x
      // higher, so a fixed 160x160 source looks soft/blocky. Scale the
      // thumbnail resolution by the device's pixel ratio (capped so we
      // never exceed the master canvas's own resolution or blow up
      // localStorage usage).
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      const baseDisplaySize = 200; // CSS px, a bit larger than the biggest expected grid cell
      let thumbSize = Math.round(baseDisplaySize * dpr);
      thumbSize = Math.max(160, Math.min(thumbSize, canvas.width)); // never upscale past the source

      function renderThumb(size, quality){
        const t = document.createElement('canvas');
        t.width = size; t.height = size;
        const tctx = t.getContext('2d');
        tctx.imageSmoothingEnabled = true;
        tctx.imageSmoothingQuality = 'high';
        tctx.drawImage(canvas, 0, 0, size, size);
        return t.toDataURL('image/jpeg', quality);
      }

      let dataUrl = renderThumb(thumbSize, 0.85);
      // Safety fallback: if the encoded image is unexpectedly large
      // (very old/limited localStorage quotas), shrink it once rather
      // than risk the save silently failing.
      if(dataUrl.length > 450000){
        dataUrl = renderThumb(Math.round(thumbSize*0.7), 0.72);
      }

      onSaveToGallery(dataUrl);
      setShareMsg('コレクションに ほぞんしました！');
    }catch(e){ setShareMsg('ほぞんできませんでした。'); }
  }

  async function handleShare(){
    const canvas = canvasRef.current;
    if(!canvas || !hasArt) return;
    const shareText = `#KataIroAtsume 形いろあつめで カードを つくったよ！`;
    try{
      if(navigator.share){
        canvas.toBlob(async (blob) => {
          try{
            if(blob && navigator.canShare && window.File){
              const file = new File([blob], 'katairo-card.png', { type:'image/png' });
              if(navigator.canShare({ files:[file] })){
                await navigator.share({ files:[file], text: shareText, title:'形いろあつめ' });
                setShareMsg('シェアしました！');
                return;
              }
            }
            await navigator.share({ text: shareText, title:'形いろあつめ' });
            setShareMsg('シェアしました！');
          }catch(err){
            /* user cancelled or share failed silently */
          }
        }, 'image/png');
      } else {
        try{
          await navigator.clipboard.writeText(shareText);
          setShareMsg('ハッシュタグを コピーしました！SNSに はりつけて シェアしてね📋');
        }catch(e){
          setShareMsg(shareText);
        }
      }
    }catch(e){
      setShareMsg('シェアできませんでした。');
    }
  }

  return (
    <div className="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="art-title" onClick={(e)=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal-sheet">
        <div className="modal-head">
          <h2 id="art-title" className="modal-title">🎨 {profile}の カード</h2>
          <button className="icon-btn" aria-label="とじる" onClick={onClose}>✕</button>
        </div>

        <div className="art-canvas-wrap">
          <canvas ref={canvasRef} width="600" height="600"></canvas>
        </div>

        {!hasArt && (
          <p style={{fontSize:'0.82rem', color:'var(--ink-soft)', textAlign:'center', marginBottom:'0.9rem'}}>
            形を まだ カウントしていません。まずは 形を タップして あつめてね🔍
          </p>
        )}

        <div className="field-group">
          <div className="field-label">🎨 カラーパレット</div>
          <div className="swatch-row">
            {Object.entries(PALETTES).map(([key, pal]) => (
              <button key={key} className={`swatch ${paletteKey===key ? 'active':''}`} onClick={()=>setPaletteKey(key)}>
                <span className="swatch-dots" aria-hidden="true">
                  {pal.colors.slice(0,4).map((c,i)=>(<i key={i} style={{background:c}}></i>))}
                </span>
                {pal.label}
              </button>
            ))}
            <label className={`custom-color-swatch ${paletteKey==='custom' ? 'active':''}`}>
              <input
                type="color"
                value={customHex}
                onChange={(e)=>{ setCustomHex(e.target.value); setPaletteKey('custom'); }}
                aria-label="じぶんで いろを えらぶ"
              />
              じぶんで えらぶ
            </label>
          </div>
        </div>

        <div className="btn-row" style={{marginBottom:'0.6rem'}}>
          <button className="btn btn-secondary" onClick={render}>🔄 つくりなおす</button>
          <button className="btn btn-secondary" onClick={handleAddToGallery} disabled={!hasArt}>📚 コレクションに保存</button>
        </div>
        <div className="btn-row">
          <button className="btn btn-primary" onClick={handleSavePng} disabled={!hasArt}>💾 PNGで保存</button>
          <button className="btn btn-primary" onClick={handleShare} disabled={!hasArt}>📤 シェア</button>
        </div>

        {shareMsg && <p style={{fontSize:'0.78rem', color:'var(--maru-dark)', fontWeight:700, textAlign:'center', marginTop:'0.7rem'}}>{shareMsg}</p>}

        <button
          className="btn btn-secondary"
          style={{width:'100%', marginTop:'0.8rem'}}
          onClick={()=>{ onReset(); onClose(); }}
        >
          🆕 あたらしいカードをつくる
        </button>
      </div>
    </div>
  );
}

/* ============================================================
   GALLERY MODAL
   ============================================================ */
function GalleryModal({ gallery, profile, onClose, onDelete }){
  const [cursor, setCursor] = useState(() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), 1); });
  const [selectedDay, setSelectedDay] = useState(null);
  const [viewing, setViewing] = useState(null);

  const byDay = useMemo(() => {
    const map = {};
    gallery.forEach(item => {
      const key = dateKeyFromTs(item.createdAt);
      if(!map[key]) map[key] = [];
      map[key].push(item);
    });
    Object.keys(map).forEach(k => map[k].sort((a,b) => b.createdAt - a.createdAt));
    return map;
  }, [gallery]);

  const year = cursor.getFullYear();
  const month = cursor.getMonth();
  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayKey = dateKeyFromTs(Date.now());

  const cells = [];
  for(let i=0;i<firstDow;i++) cells.push(null);
  for(let day=1; day<=daysInMonth; day++){
    const key = `${year}-${pad2(month+1)}-${pad2(day)}`;
    cells.push({ day, key, items: byDay[key] || [] });
  }

  function prevMonth(){ setCursor(new Date(year, month-1, 1)); }
  function nextMonth(){ setCursor(new Date(year, month+1, 1)); }

  function openDay(cell){
    if(!cell || cell.items.length === 0) return;
    if(cell.items.length === 1){ setViewing(cell.items[0]); }
    else { setSelectedDay(cell.key); }
  }

  const dayItems = selectedDay ? (byDay[selectedDay] || []) : [];

  return (
    <div className="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="gallery-title" onClick={(e)=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal-sheet">
        <div className="modal-head">
          <h2 id="gallery-title" className="modal-title">📚 {profile}の コレクション</h2>
          <button className="icon-btn" aria-label="とじる" onClick={onClose}>✕</button>
        </div>

        {viewing ? (
          <div>
            <img src={viewing.dataUrl} alt="保存したカード" style={{width:'100%', borderRadius:'16px', marginBottom:'0.8rem'}} />
            <div className="btn-row">
              <button className="btn btn-secondary" onClick={()=>setViewing(null)}>← もどる</button>
              <button className="btn btn-secondary" style={{color:'var(--sos-dark)'}} onClick={()=>{ onDelete(viewing.id); setViewing(null); }}>🗑 さくじょ</button>
            </div>
          </div>
        ) : selectedDay ? (
          <div>
            <button className="step-back" onClick={()=>setSelectedDay(null)}>← カレンダーに もどる</button>
            <p style={{fontWeight:800, margin:'0.4rem 0 0.7rem'}}>{selectedDay} の カード</p>
            <div className="gallery-grid">
              {dayItems.map(item => (
                <button key={item.id} className="gallery-item" onClick={()=>setViewing(item)} aria-label="カードをみる">
                  <img src={item.dataUrl} alt="保存したカード" />
                </button>
              ))}
            </div>
          </div>
        ) : (
          <div>
            <div className="calendar-header">
              <button className="icon-btn" aria-label="まえの月" onClick={prevMonth}>◀</button>
              <span className="calendar-month-label">{year}年 {month+1}月</span>
              <button className="icon-btn" aria-label="つぎの月" onClick={nextMonth}>▶</button>
            </div>
            <div className="calendar-weekday-row">
              {WEEKDAYS_JA.map(w => (<span key={w}>{w}</span>))}
            </div>
            <div className="calendar-grid">
              {cells.map((cell, idx) => cell ? (
                <button
                  key={cell.key}
                  className={`calendar-cell ${cell.items.length ? 'has-card':''} ${cell.key===todayKey ? 'today':''}`}
                  onClick={()=>openDay(cell)}
                  disabled={cell.items.length===0}
                  aria-label={`${cell.day}日${cell.items.length ? '、カードあり':''}`}
                >
                  <span className="calendar-daynum">{cell.day}</span>
                  {cell.items[0] && <img src={cell.items[0].dataUrl} alt="" aria-hidden="true" />}
                  {cell.items.length>1 && <span className="calendar-badge">+{cell.items.length-1}</span>}
                </button>
              ) : (
                <span key={'empty-'+idx} className="calendar-cell empty" aria-hidden="true"></span>
              ))}
            </div>
            {gallery.length === 0 && (
              <div className="gallery-empty">まだ カードが ありません。<br/>「カードを 作る」から はじめてみよう🎨</div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   SOS MODAL
   ============================================================ */
function SosModal({ onClose }){
  const [step, setStep] = useState(0); // 0 lang, 1 category, 2 question, 3 result
  const [lang, setLang] = useState(null);
  const [category, setCategory] = useState(null);
  const [branch, setBranch] = useState(null); // 'yes' | 'no'

  function reset(){ setStep(0); setLang(null); setCategory(null); setBranch(null); }

  function chooseLang(code){ setLang(code); setStep(1); }
  function chooseCategory(cat){ setCategory(cat); setStep(2); }
  function answer(ans){
    setBranch(ans === 'yes' ? 'yes' : 'no');
    setStep(3);
  }

  const title = step===0 ? SOS_UI.title.ja : `${SOS_UI.title.ja}${lang && lang!=='ja' ? ' / ' + SOS_UI.title[lang] : ''}`;

  return (
    <div className="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="sos-title" onClick={(e)=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal-sheet">
        <div className="modal-head">
          <h2 id="sos-title" className="modal-title">🆘 {title}</h2>
          <button className="icon-btn" aria-label="とじる" onClick={onClose}>✕</button>
        </div>

        {step > 0 && (
          <button className="step-back" onClick={() => setStep(s => Math.max(0, s-1))}>
            ← {SOS_UI.back.ja}{lang && lang!=='ja' ? ` / ${SOS_UI.back[lang]}` : ''}
          </button>
        )}

        {step === 0 && (
          <div>
            <p style={{fontWeight:700, marginBottom:'0.8rem'}}>{SOS_UI.pickLang.ja}</p>
            <div className="sos-lang-grid">
              {LANGS.map(l => (
                <button key={l.code} className="sos-lang-btn" onClick={()=>chooseLang(l.code)}>
                  <span className="flag" aria-hidden="true">{l.flag}</span>
                  <span className="lbl">{l.label}</span>
                </button>
              ))}
            </div>
          </div>
        )}

        {step === 1 && (
          <div>
            <p style={{fontWeight:700, marginBottom:'0.8rem'}}>
              {SOS_UI.pickCat.ja}
              {lang!=='ja' && (
                <React.Fragment>
                  <br/>
                  <span style={{fontWeight:500, color:'var(--ink-soft)', fontSize:'0.82rem'}}>{SOS_UI.pickCat[lang]}</span>
                </React.Fragment>
              )}
            </p>
            <div className="sos-cat-grid">
              {SOS_CATEGORIES.map(cat => (
                <button key={cat.id} className="sos-cat-btn" onClick={()=>chooseCategory(cat)}>
                  <span className="em" aria-hidden="true">{cat.em}</span>
                  <span className="lbl">{cat.label.ja}</span>
                  {lang!=='ja' && <span className="lbl-sub">{cat.label[lang]}</span>}
                </button>
              ))}
            </div>
          </div>
        )}

        {step === 2 && category && (
          <div>
            <div className="sos-question-card">
              <span className="em" aria-hidden="true">{category.em}</span>
              <p>{category.question.ja}</p>
              {lang!=='ja' && <p className="sub">{category.question[lang]}</p>}
            </div>
            <div className="sos-answer-row">
              <button className="sos-answer-btn" onClick={()=>answer('yes')}>
                {SOS_UI.yes.ja}{lang!=='ja' ? ` / ${SOS_UI.yes[lang]}` : ''}
              </button>
              <button className="sos-answer-btn" onClick={()=>answer('no')}>
                {SOS_UI.no.ja}{lang!=='ja' ? ` / ${SOS_UI.no[lang]}` : ''}
              </button>
              <button className="sos-answer-btn" onClick={()=>answer('dunno')}>
                {SOS_UI.dunno.ja}{lang!=='ja' ? ` / ${SOS_UI.dunno[lang]}` : ''}
              </button>
            </div>
          </div>
        )}

        {step === 3 && category && branch && (
          <div>
            <div className="sos-result-card">
              <span className="badge">{category[branch].title.ja}</span>
              <div className="phrase-main">{category[branch].phrase.ja}</div>
              {lang!=='ja' && <div className="phrase-sub">{category[branch].phrase[lang]}</div>}
              <div className="note">
                {category[branch].note.ja}
                {lang!=='ja' && (
                  <React.Fragment>
                    <br/><br/>{category[branch].note[lang]}
                  </React.Fragment>
                )}
              </div>
            </div>
            <p style={{textAlign:'center', fontWeight:700, fontSize:'0.82rem', marginBottom:'1rem'}}>
              📱 {SOS_UI.showScreen.ja}{lang!=='ja' ? ` / ${SOS_UI.showScreen[lang]}` : ''}
            </p>

            <div className="field-label">☎️ {SOS_UI.emergency.ja}{lang!=='ja' ? ` / ${SOS_UI.emergency[lang]}` : ''}</div>
            <div className="emergency-row" style={{marginBottom:'1rem'}}>
              <div className="emergency-chip">
                <b>119</b>
                <span>{SOS_UI.ambulance.ja}{lang!=='ja' ? ` / ${SOS_UI.ambulance[lang]}` : ''}</span>
              </div>
              <div className="emergency-chip">
                <b>110</b>
                <span>{SOS_UI.police.ja}{lang!=='ja' ? ` / ${SOS_UI.police[lang]}` : ''}</span>
              </div>
            </div>

            <button className="btn btn-secondary" style={{width:'100%'}} onClick={reset}>
              🔁 {SOS_UI.again.ja}{lang!=='ja' ? ` / ${SOS_UI.again[lang]}` : ''}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   PWA INSTALL BANNER
   ============================================================ */
function useInstallPrompt(){
  const [deferredPrompt, setDeferredPrompt] = useState(null);
  const [isStandalone, setIsStandalone] = useState(false);
  const [isIOS, setIsIOS] = useState(false);

  useEffect(() => {
    try{
      const standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
      setIsStandalone(!!standalone);
    }catch(e){}
    try{
      const ua = window.navigator.userAgent || '';
      const iOSDevice = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      setIsIOS(iOSDevice);
    }catch(e){}

    function handler(e){
      try{ e.preventDefault(); }catch(err){}
      setDeferredPrompt(e);
    }
    try{ window.addEventListener('beforeinstallprompt', handler); }catch(e){}
    return () => { try{ window.removeEventListener('beforeinstallprompt', handler); }catch(e){} };
  }, []);

  return { deferredPrompt, setDeferredPrompt, isStandalone, isIOS };
}

function InstallBanner(){
  const { deferredPrompt, setDeferredPrompt, isStandalone, isIOS } = useInstallPrompt();
  const [dismissed, setDismissed] = useState(() => safeStorage.get('katairo_pwa_dismissed', false));

  const showAndroid = !!deferredPrompt;
  const showIOS = isIOS && !deferredPrompt;

  if(isStandalone || dismissed || (!showAndroid && !showIOS)) return null;

  function dismiss(){
    safeStorage.set('katairo_pwa_dismissed', true);
    setDismissed(true);
  }

  async function handleInstall(){
    if(!deferredPrompt) return;
    try{
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
    }catch(e){}
    setDeferredPrompt(null);
    dismiss();
  }

  return (
    <div className="install-banner">
      <span className="install-icon" aria-hidden="true">📲</span>
      <div className="install-text">
        {showAndroid && <p>このアプリを ホーム画面に インストールできます！</p>}
        {showIOS && <p>共有アイコン（<span aria-hidden="true">⬆️</span>）から「ホーム画面に追加」を えらんでね</p>}
      </div>
      {showAndroid && <button className="btn btn-primary install-btn" onClick={handleInstall}>インストール</button>}
      <button className="icon-btn install-close" aria-label="とじる" onClick={dismiss}>✕</button>
    </div>
  );
}

/* ============================================================
   MAIN APP
   ============================================================ */
function App(){
  const [profiles, setProfiles] = useState(() => safeStorage.get('katairo_profiles', DEFAULT_PROFILES));
  const [profile, setProfile] = useState(() => safeStorage.get('katairo_current_profile', DEFAULT_PROFILES[0]));
  const [tone, setTone] = useState(() => safeStorage.get('katairo_settings_tone', 'fuwafuwa'));
  const [timerMin, setTimerMin] = useState(() => safeStorage.get('katairo_settings_timer', 2));

  const [counts, setCounts] = useState(() => safeStorage.get(keyProfileCounts(profile), emptyCounts()));
  const [gallery, setGallery] = useState(() => safeStorage.get(keyProfileGallery(profile), []));
  const [history, setHistory] = useState([]);

  const [showManner, setShowManner] = useState(() => !safeStorage.get('katairo_manner_seen', false));
  const [showHelp, setShowHelp] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [showArt, setShowArt] = useState(false);
  const [showGallery, setShowGallery] = useState(false);
  const [showSos, setShowSos] = useState(false);

  const [pulseId, setPulseId] = useState(null);
  const [toastVisible, setToastVisible] = useState(false);
  const toastTimeoutRef = useRef(null);

  // make sure the active profile still exists (e.g. after data migrated from an older version)
  useEffect(() => {
    if(profiles.length && profiles.indexOf(profile) === -1){
      setProfile(profiles[0]);
    }
  }, []);

  // persist profile list
  useEffect(() => { safeStorage.set('katairo_profiles', profiles); }, [profiles]);

  // load per-profile data when profile changes
  useEffect(() => {
    setCounts(safeStorage.get(keyProfileCounts(profile), emptyCounts()));
    setGallery(safeStorage.get(keyProfileGallery(profile), []));
    setHistory([]);
    safeStorage.set('katairo_current_profile', profile);
  }, [profile]);

  useEffect(() => { safeStorage.set(keyProfileCounts(profile), counts); }, [counts, profile]);
  useEffect(() => { safeStorage.set(keyProfileGallery(profile), gallery); }, [gallery, profile]);
  useEffect(() => { safeStorage.set('katairo_settings_tone', tone); }, [tone]);
  useEffect(() => { safeStorage.set('katairo_settings_timer', timerMin); }, [timerMin]);

  // face-up timer
  useEffect(() => {
    const intervalMs = Math.max(1, timerMin) * 60 * 1000;
    const id = setInterval(() => {
      setToastVisible(true);
      if(toastTimeoutRef.current) clearTimeout(toastTimeoutRef.current);
      toastTimeoutRef.current = setTimeout(() => setToastVisible(false), 6000);
    }, intervalMs);
    return () => { clearInterval(id); if(toastTimeoutRef.current) clearTimeout(toastTimeoutRef.current); };
  }, [timerMin]);

  function handleMannerAgree(){
    safeStorage.set('katairo_manner_seen', true);
    setShowManner(false);
  }

  function handleTap(shapeId){
    setCounts(c => ({ ...c, [shapeId]: (c[shapeId]||0) + 1 }));
    setHistory(h => [...h, shapeId].slice(-50));
    setPulseId(shapeId);
    setTimeout(() => setPulseId(p => p===shapeId ? null : p), 450);
  }

  function handleUndo(){
    setHistory(h => {
      if(h.length === 0) return h;
      const last = h[h.length-1];
      setCounts(c => ({ ...c, [last]: Math.max(0, (c[last]||0) - 1) }));
      return h.slice(0, -1);
    });
  }

  function handleSaveArt(dataUrl){
    setGallery(g => {
      const next = [...g, { id: `${Date.now()}`, dataUrl, createdAt: Date.now() }];
      return next.slice(-24); // keep it bounded for storage size
    });
  }

  function handleResetCounts(){
    setCounts(emptyCounts());
    setHistory([]);
  }

  function handleDeleteArt(id){
    setGallery(g => g.filter(item => item.id !== id));
  }

  function handleAddProfile(name){
    const trimmed = (name||'').trim();
    if(!trimmed) return { ok:false, msg:'なまえを にゅうりょくしてください' };
    if(profiles.indexOf(trimmed) !== -1) return { ok:false, msg:'おなじ なまえが あります' };
    setProfiles(p => [...p, trimmed]);
    return { ok:true };
  }

  function handleRenameProfile(oldName, newName){
    const trimmed = (newName||'').trim();
    if(!trimmed) return { ok:false, msg:'なまえを にゅうりょくしてください' };
    if(trimmed === oldName) return { ok:true };
    if(profiles.indexOf(trimmed) !== -1) return { ok:false, msg:'おなじ なまえが あります' };
    const c = safeStorage.get(keyProfileCounts(oldName), emptyCounts());
    const g = safeStorage.get(keyProfileGallery(oldName), []);
    safeStorage.set(keyProfileCounts(trimmed), c);
    safeStorage.set(keyProfileGallery(trimmed), g);
    safeStorage.remove(keyProfileCounts(oldName));
    safeStorage.remove(keyProfileGallery(oldName));
    setProfiles(p => p.map(x => x===oldName ? trimmed : x));
    if(profile === oldName) setProfile(trimmed);
    return { ok:true };
  }

  function handleDeleteProfile(name){
    if(profiles.length <= 1) return { ok:false, msg:'さいごの ひとりは けせません' };
    const remaining = profiles.filter(x => x!==name);
    setProfiles(remaining);
    safeStorage.remove(keyProfileCounts(name));
    safeStorage.remove(keyProfileGallery(name));
    if(profile === name){
      setProfile(remaining[0]);
    }
    return { ok:true };
  }

  const total = SHAPES.reduce((s,sh) => s + (counts[sh.id]||0), 0);
  const lastShapeId = history.length ? history[history.length-1] : null;

  return (
    <div className="app-shell">
      <header className="app-header">
        <div className="brand-row">
          <div className="brand">
            <div className="brand-badge">
              <img src="icon-192.png" alt="ロゴ" className="brand-logo" />
            </div>
            <div style={{minWidth:0}}>
              <div className="brand-title">かたちあつめいろあつめ - まちのなかをよくみるアプリ</div>
              <div className="brand-sub">街なかSOSつき</div>
            </div>
          </div>
          <div style={{display:'flex', gap:'0.4rem', alignItems:'center', flexShrink:0}}>
            <button className="icon-btn" aria-label="あそびかた" onClick={()=>setShowHelp(true)}>❓</button>
            <button className="icon-btn" aria-label="せってい" onClick={()=>setShowSettings(true)}>⚙️</button>
            <button className="sos-btn" onClick={()=>setShowSos(true)}>
              <span aria-hidden="true">🆘</span> SOS
            </button>
          </div>
        </div>

        <div className="profile-row" role="radiogroup" aria-label="プロフィールをえらぶ">
          {profiles.map(p => (
            <button
              key={p}
              className={`profile-pill ${profile===p ? 'active':''}`}
              role="radio"
              aria-checked={profile===p}
              onClick={()=>setProfile(p)}
            >
              {profile===p && <span className="check" aria-hidden="true">●</span>}
              {p}
            </button>
          ))}
        </div>
      </header>

      <div className="safety-strip">
        <span>📷カメラ・📍位置情報は 使用しません。あんぜんに あそぼうね！</span>
        <button onClick={()=>setShowSettings(true)}>せってい</button>
      </div>

      <InstallBanner />

      <main>
        <div className="greet">
          <div className="greet-name">{profile}さんの けいすう</div>
          <div className="greet-tone">ひょうじ：{getToneLabel(tone)} ／ かおあげタイマー：{timerMin}分ごと</div>
        </div>

        <div className="shape-grid">
          {SHAPES.map(shape => (
            <div
              key={shape.id}
              className={`shape-tile ${pulseId===shape.id ? 'pulse':''}`}
              style={{ borderColor: pulseId===shape.id ? shape.color : undefined }}
              onClick={()=>handleTap(shape.id)}
              role="button"
              tabIndex={0}
              aria-label={`${SHAPE_ARIA[shape.id]}を かぞえる。いま ${counts[shape.id]||0}こ`}
              onKeyDown={(e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); handleTap(shape.id); } }}
            >
              <div className={`ring-burst ${pulseId===shape.id ? 'show':''}`} style={{borderColor: shape.color}}></div>
              <span className="count-chip" style={{background: shape.color}}>{counts[shape.id]||0}</span>
              <div className="icon-wrap"><ShapeIcon id={shape.id} color={shape.color} /></div>
              {tone !== 'sukkiri' && <div className="shape-label">{shape.labels[tone]}</div>}
              {tone === 'sukkiri' && <span className="sr-only">{SHAPE_ARIA[shape.id]}</span>}
            </div>
          ))}
        </div>

        <div className="stats-card">
          <div className="stats-total"><b>{total}</b><span>こ あつまった！</span></div>
          {history.length > 0 && (
            <button className="btn btn-secondary btn-undo" onClick={handleUndo}>
              ↩️ ひとつ戻す（{SHAPE_ARIA[lastShapeId]}を けす）
            </button>
          )}
          <div className="btn-row">
            <button className="btn btn-primary" onClick={()=>setShowArt(true)}>🎨 カードを作る</button>
            <button className="btn btn-secondary" onClick={()=>setShowGallery(true)}>📚 コレクション</button>
          </div>
        </div>
      </main>

      <AppFooter />

      <FaceUpToast show={toastVisible} onClose={()=>setToastVisible(false)} />

      {showManner && <MannerDialog onAgree={handleMannerAgree} />}
      {showHelp && <HelpModal onClose={()=>setShowHelp(false)} />}
      {showSettings && (
        <SettingsSheet
          tone={tone} setTone={setTone}
          timerMin={timerMin} setTimerMin={setTimerMin}
          profiles={profiles}
          currentProfile={profile}
          onAddProfile={handleAddProfile}
          onRenameProfile={handleRenameProfile}
          onDeleteProfile={handleDeleteProfile}
          onClose={()=>setShowSettings(false)}
        />
      )}
      {showArt && (
        <ArtModal
          counts={counts}
          profile={profile}
          onClose={()=>setShowArt(false)}
          onSaveToGallery={handleSaveArt}
          onReset={handleResetCounts}
        />
      )}
      {showGallery && (
        <GalleryModal
          gallery={gallery}
          profile={profile}
          onClose={()=>setShowGallery(false)}
          onDelete={handleDeleteArt}
        />
      )}
      {showSos && <SosModal onClose={()=>setShowSos(false)} />}
    </div>
  );
}

try{
  const rootEl = ReactDOM.createRoot(document.getElementById('root'));
  rootEl.render(<App />);
  window.__katairoBooted = true;
}catch(e){
  window.showBootError && window.showBootError((e && e.message) || 'render');
}

        }catch(e){ /* ignore: SW is optional */ }
      });
    }
  }catch(e){ /* ignore: SW is optional */ }
