<!DOCTYPE html>
<html lang="ja">

<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />

<style>
  :root{
    --bg: #F5F6F0;
    --surface: #FFFFFF;
    --surface-alt: #EBEEE3;
    --ink: #23282A;
    --ink-soft: #5B6265;
    --line: #DCDED4;

    --maru: #1C7C8C;
    --maru-dark: #145867;
    --sankaku: #E2672B;
    --sankaku-dark: #B24E1F;
    --shikaku: #5B4E8C;
    --shikaku-dark: #423669;
    --aachi: #C9A227;
    --aachi-dark: #9C7D1B;

    --sos: #D6483A;
    --sos-dark: #A9382D;

    --font-display: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', sans-serif;
    --font-body: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Noto Sans JP', sans-serif;

    --radius-badge: 999px;
    --radius-card: 22px;
    --radius-tile: 20px;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  h1,h2,h3, .display{ font-family: var(--font-display); }

  button{ font-family: inherit; }
  button:focus-visible, [tabindex]:focus-visible, a:focus-visible, input:focus-visible{
    outline: 3px solid #1C7C8C;
    outline-offset: 2px;
  }

  ::-webkit-scrollbar{ width: 8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 10px; }

  .app-shell{
    max-width: 600px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* ---- Header ---- */
  .app-header{
    position: sticky; top:0; z-index: 30;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 0.65rem 0.85rem;
  }
  .brand-row{ display:flex; align-items:center; justify-content: space-between; gap: 0.5rem; }
  .brand{ display:flex; align-items:center; gap:0.5rem; min-width:0; }
  .brand-badge{
    width: 38px; height: 38px; border-radius: 12px;
    background: linear-gradient(135deg, var(--maru), var(--maru-dark));
    display:flex; align-items:center; justify-content:center;
    flex-shrink: 0;
  }
  .brand-title{ font-family: var(--font-display); font-weight:800; font-size: 1.02rem; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .brand-sub{ font-size: 0.68rem; color: var(--ink-soft); }

  .icon-btn{
    min-width:44px; min-height:44px; border-radius: var(--radius-badge);
    display:flex; align-items:center; justify-content:center;
    border: 1.5px solid var(--line); background: var(--surface);
    font-size: 1.15rem; cursor:pointer; transition: transform .12s ease, background .15s ease;
  }
  .icon-btn:active{ transform: scale(0.92); }

  .sos-btn{
    background: var(--sos); color:#fff; border-color: var(--sos-dark);
    font-weight: 800; font-family: var(--font-display);
    padding: 0 0.85rem; min-height: 44px; border-radius: var(--radius-badge);
    display:flex; align-items:center; gap:0.35rem; font-size:0.85rem;
    box-shadow: 0 3px 0 var(--sos-dark);
  }
  .sos-btn:active{ transform: translateY(2px); box-shadow:none; }

  /* ---- profile pills ---- */
  .profile-row{ display:flex; gap:0.4rem; margin-top:0.6rem; overflow-x:auto; padding-bottom:2px; }
  .profile-pill{
    flex-shrink:0; min-height:40px; padding: 0 0.9rem; border-radius: var(--radius-badge);
    border: 1.5px solid var(--line); background: var(--surface-alt);
    font-weight:700; font-size:0.85rem; color: var(--ink-soft);
    display:flex; align-items:center; gap:0.3rem; cursor:pointer;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .profile-pill.active{
    background: var(--ink); color:#fff; border-color: var(--ink);
  }
  .profile-pill .check{ font-size:0.75rem; }

  /* ---- safety strip ---- */
  .safety-strip{
    background: var(--surface-alt);
    color: var(--ink-soft);
    font-size: 0.72rem;
    padding: 0.4rem 0.85rem;
    display:flex; align-items:center; justify-content:space-between; gap:0.5rem;
    border-bottom: 1px solid var(--line);
  }
  .safety-strip button{
    background:none; border:none; color: var(--maru-dark); font-weight:700; font-size:0.72rem;
    text-decoration: underline; cursor:pointer; min-height:32px; flex-shrink:0;
  }

  /* ---- main ---- */
  main{ flex:1; padding: 1rem 0.85rem 2rem; }

  .greet{ margin-bottom: 0.9rem; }
  .greet-name{ font-family: var(--font-display); font-weight:800; font-size:1.35rem; }
  .greet-tone{ font-size:0.78rem; color: var(--ink-soft); margin-top:0.15rem; }

  .shape-grid{
    display:grid; grid-template-columns: 1fr 1fr; gap: 0.7rem;
  }
  .shape-tile{
    position: relative;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: var(--radius-tile);
    padding: 0.9rem 0.6rem 0.7rem;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height: 148px;
    cursor:pointer;
    box-shadow: 0 2px 0 rgba(0,0,0,0.04);
    transition: transform .08s ease;
    user-select:none;
  }
  .shape-tile:active{ transform: scale(0.96); }
  .shape-tile .count-chip{
    position:absolute; top:0.5rem; right:0.5rem;
    min-width: 30px; height: 26px; padding: 0 0.4rem;
    border-radius: var(--radius-badge);
    color:#fff; font-weight:800; font-size:0.8rem; font-family: var(--font-display);
    display:flex; align-items:center; justify-content:center;
  }
  .shape-tile .icon-wrap{ width:64px; height:64px; display:flex; align-items:center; justify-content:center; margin-bottom:0.35rem; }
  .shape-tile .shape-label{ font-weight:700; font-size:0.85rem; color: var(--ink); }
  .shape-tile.pulse{ animation: tilePulse 0.42s ease; }
  @keyframes tilePulse{
    0%{ transform: scale(1); }
    35%{ transform: scale(1.08); }
    100%{ transform: scale(1); }
  }
  .ring-burst{
    position:absolute; inset:0; border-radius: var(--radius-tile);
    border: 3px solid transparent; pointer-events:none;
  }
  .ring-burst.show{ animation: ringBurst 0.5s ease-out; }
  @keyframes ringBurst{
    0%{ box-shadow: 0 0 0 0 rgba(0,0,0,0.18); }
    100%{ box-shadow: 0 0 0 10px rgba(0,0,0,0); }
  }

  .stats-card{
    margin-top: 1rem; background: var(--surface); border:1.5px solid var(--line);
    border-radius: var(--radius-card); padding: 1rem;
  }
  .stats-total{ display:flex; align-items:baseline; gap:0.4rem; justify-content:center; margin-bottom:0.85rem; }
  .stats-total b{ font-family: var(--font-display); font-size: 1.9rem; color: var(--maru-dark); }
  .stats-total span{ font-size: 0.85rem; color: var(--ink-soft); }

  .btn{
    min-height: 48px; border-radius: var(--radius-badge); border:none; cursor:pointer;
    font-weight:800; font-family: var(--font-display); font-size:0.92rem;
    display:flex; align-items:center; justify-content:center; gap:0.4rem;
    transition: transform .1s ease, opacity .15s ease;
  }
  .btn:active{ transform: scale(0.97); }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .btn-primary{ background: var(--maru); color:#fff; box-shadow: 0 3px 0 var(--maru-dark); }
  .btn-primary:active:not(:disabled){ box-shadow:none; transform: translateY(3px) scale(0.99); }
  .btn-secondary{ background: var(--surface-alt); color: var(--ink); border:1.5px solid var(--line); }
  .btn-row{ display:flex; gap:0.6rem; }
  .btn-row .btn{ flex:1; }

  /* ---- footer ---- */
  footer{ margin-top: auto; }

  /* ---- toast ---- */
  .faceup-toast{
    position: fixed; top: 0.7rem; left:50%; transform: translateX(-50%) translateY(-140%);
    max-width: 560px; width: calc(100% - 1.4rem);
    background: var(--ink); color:#fff; border-radius: 16px;
    padding: 0.7rem 0.9rem; display:flex; align-items:center; gap:0.6rem;
    z-index: 80; box-shadow: 0 8px 24px rgba(0,0,0,0.22);
    transition: transform .35s cubic-bezier(.34,1.3,.64,1);
  }
  .faceup-toast.show{ transform: translateX(-50%) translateY(0); }
  .faceup-toast p{ font-size:0.82rem; line-height:1.4; margin:0; flex:1; }
  .faceup-toast .close-x{ background:rgba(255,255,255,0.15); border:none; color:#fff; width:30px; height:30px; border-radius:50%; flex-shrink:0; cursor:pointer; font-size:0.9rem; }

  /* ---- modal ---- */
  .modal-overlay{
    position: fixed; inset:0; background: rgba(20,20,18,0.5);
    display:flex; align-items:flex-end; justify-content:center; z-index: 100;
    padding: 0;
  }
  @media (min-width: 640px){
    .modal-overlay{ align-items:center; padding: 1rem; }
  }
  .modal-sheet{
    background: var(--surface); width:100%; max-width:600px;
    border-radius: 24px 24px 0 0;
    max-height: 92vh; overflow-y:auto;
    padding: 1.1rem 1.1rem 1.4rem;
    animation: sheetUp .28s cubic-bezier(.32,.72,0,1);
  }
  @media (min-width: 640px){
    .modal-sheet{ border-radius: 24px; max-height: 88vh; }
  }
  @keyframes sheetUp{ from{ transform: translateY(24px); opacity:0; } to{ transform: translateY(0); opacity:1; } }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:0.9rem; }
  .modal-title{ font-family: var(--font-display); font-weight:800; font-size:1.1rem; }

  .segmented{ display:flex; background: var(--surface-alt); border-radius: var(--radius-badge); padding:4px; gap:2px; }
  .segmented button{
    flex:1; border:none; background:transparent; padding: 0.55rem 0.3rem; border-radius: var(--radius-badge);
    font-weight:700; font-size: 0.8rem; color: var(--ink-soft); cursor:pointer; min-height:40px;
  }
  .segmented button.active{ background: var(--ink); color:#fff; }

  .field-group{ margin-bottom: 1.1rem; }
  .field-label{ font-weight:800; font-size:0.85rem; margin-bottom:0.5rem; display:flex; align-items:center; gap:0.35rem; }
  .field-hint{ font-size:0.72rem; color: var(--ink-soft); margin-top:0.4rem; }

  .swatch-row{ display:flex; gap:0.5rem; flex-wrap:wrap; }
  .swatch{
    padding: 0.5rem 0.8rem; border-radius: var(--radius-badge); border: 2px solid var(--line);
    display:flex; align-items:center; gap:0.4rem; cursor:pointer; font-weight:700; font-size:0.8rem; background:#fff;
    min-height:44px;
  }
  .swatch.active{ border-color: var(--ink); background: var(--surface-alt); }
  .swatch-dots{ display:flex; }
  .swatch-dots i{ width:12px; height:12px; border-radius:50%; margin-left:-4px; border:1.5px solid #fff; display:inline-block; }
  .swatch-dots i:first-child{ margin-left:0; }

  .art-canvas-wrap{ border-radius: 18px; overflow:hidden; border:1.5px solid var(--line); background: var(--surface-alt); margin-bottom: 0.9rem; }
  .art-canvas-wrap canvas{ width:100%; height:auto; display:block; }

  .gallery-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:0.5rem; }
  .gallery-item{ position:relative; border-radius:14px; overflow:hidden; border:1.5px solid var(--line); aspect-ratio:1/1; cursor:pointer; background: var(--surface-alt); }
  .gallery-item img{ width:100%; height:100%; object-fit:cover; display:block; }
  .gallery-empty{ text-align:center; padding: 2rem 1rem; color: var(--ink-soft); font-size:0.85rem; }

  .manner-list{ display:flex; flex-direction:column; gap:0.6rem; margin: 0.9rem 0 1.2rem; }
  .manner-item{ display:flex; gap:0.6rem; align-items:flex-start; background: var(--surface-alt); padding:0.7rem; border-radius:14px; }
  .manner-item .em{ font-size:1.3rem; line-height:1; flex-shrink:0; }
  .manner-item p{ margin:0; font-size:0.85rem; line-height:1.5; }

  /* ---- SOS ---- */
  .sos-lang-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:0.6rem; }
  .sos-lang-btn{
    border:1.5px solid var(--line); background:#fff; border-radius:16px; padding:0.9rem 0.6rem;
    display:flex; flex-direction:column; align-items:center; gap:0.3rem; cursor:pointer; min-height:70px;
  }
  .sos-lang-btn .flag{ font-size:1.6rem; }
  .sos-lang-btn .lbl{ font-weight:700; font-size:0.85rem; }

  .sos-cat-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:0.6rem; }
  .sos-cat-btn{
    border:1.5px solid var(--line); background:#fff; border-radius:16px; padding:1rem 0.6rem;
    display:flex; flex-direction:column; align-items:center; gap:0.4rem; cursor:pointer; min-height:100px; text-align:center;
  }
  .sos-cat-btn .em{ font-size:2rem; }
  .sos-cat-btn .lbl{ font-weight:800; font-size:0.82rem; line-height:1.3; }
  .sos-cat-btn .lbl-sub{ font-size:0.68rem; color: var(--ink-soft); }

  .sos-question-card{ background: var(--surface-alt); border-radius:18px; padding:1.1rem; text-align:center; margin-bottom:1rem; }
  .sos-question-card .em{ font-size:2.2rem; }
  .sos-question-card p{ font-weight:800; font-size:1.02rem; margin: 0.5rem 0 0.2rem; }
  .sos-question-card .sub{ font-size:0.8rem; color: var(--ink-soft); font-weight:500; }

  .sos-answer-row{ display:flex; flex-direction:column; gap:0.55rem; }
  .sos-answer-btn{
    min-height:52px; border-radius:16px; border:1.5px solid var(--line); background:#fff;
    font-weight:800; font-size:0.95rem; cursor:pointer;
  }

  .sos-result-card{
    border-radius:20px; padding:1.2rem; color:#fff; background: linear-gradient(160deg, var(--maru), var(--maru-dark));
    text-align:center; margin-bottom:1rem;
  }
  .sos-result-card .badge{ background: rgba(255,255,255,0.2); display:inline-block; padding:0.25rem 0.7rem; border-radius:var(--radius-badge); font-size:0.7rem; font-weight:700; margin-bottom:0.6rem; }
  .sos-result-card .phrase-main{ font-size:1.15rem; font-weight:800; line-height:1.5; margin-bottom:0.5rem; }
  .sos-result-card .phrase-sub{ font-size:0.85rem; opacity:0.92; line-height:1.5; margin-bottom:0.7rem; }
  .sos-result-card .note{ font-size:0.75rem; background: rgba(255,255,255,0.15); border-radius:12px; padding:0.6rem; line-height:1.5; }

  .emergency-row{ display:flex; gap:0.5rem; }
  .emergency-chip{ flex:1; background: var(--surface-alt); border-radius:14px; padding:0.6rem; text-align:center; }
  .emergency-chip b{ display:block; font-family: var(--font-display); font-size:1.15rem; color: var(--sos-dark); }
  .emergency-chip span{ font-size:0.68rem; color: var(--ink-soft); }

  .step-back{ background:none; border:none; color: var(--ink-soft); font-weight:700; font-size:0.82rem; cursor:pointer; display:flex; align-items:center; gap:0.2rem; min-height:40px; }

  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }
</style>
</head>

const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ============================================================
   SAFE STORAGE — localStorage with in-memory fallback so the
   app never throws inside sandboxed preview environments.
   ============================================================ */
const memoryStore = {};
const safeStorage = {
  get(key, fallback){
    try{
      const raw = window.localStorage.getItem(key);
      if(raw === null || raw === undefined) return fallback;
      return JSON.parse(raw);
    }catch(e){
      return Object.prototype.hasOwnProperty.call(memoryStore, key) ? memoryStore[key] : fallback;
    }
  },
  set(key, value){
    memoryStore[key] = value;
    try{
      window.localStorage.setItem(key, JSON.stringify(value));
      return true;
    }catch(e){
      return false;
    }
  }
};

/* ============================================================
   HELPERS
   ============================================================ */
function keyProfileCounts(p){ return `katairo_counts_${p}`; }
function keyProfileGallery(p){ return `katairo_gallery_${p}`; }
const emptyCounts = () => ({ maru:0, sankaku:0, shikaku:0, aachi:0 });

function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const bigint = parseInt(h.length===3 ? h.split('').map(c=>c+c).join('') : h, 16);
  const r = (bigint>>16)&255, g=(bigint>>8)&255, b=bigint&255;
  return `rgba(${r},${g},${b},${alpha})`;
}

function drawShape(ctx, shapeId, x, y, r, color, alpha, rot){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.fillStyle = color;
  if(shapeId === 'maru'){
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
  } else if(shapeId === 'sankaku'){
    ctx.beginPath();
    ctx.moveTo(0,-r); ctx.lineTo(r*0.87, r*0.6); ctx.lineTo(-r*0.87, r*0.6); ctx.closePath(); ctx.fill();
  } else if(shapeId === 'shikaku'){
    const s = r*1.5;
    ctx.beginPath();
    const rr = s*0.18;
    ctx.moveTo(-s/2+rr, -s/2);
    ctx.arcTo(s/2,-s/2, s/2,s/2, rr);
    ctx.arcTo(s/2,s/2, -s/2,s/2, rr);
    ctx.arcTo(-s/2,s/2, -s/2,-s/2, rr);
    ctx.arcTo(-s/2,-s/2, s/2,-s/2, rr);
    ctx.closePath(); ctx.fill();
  } else if(shapeId === 'aachi'){
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI,false); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function generateArt(canvas, counts, paletteColors){
  const size = canvas.width;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,size,size);

  const bgGrad = ctx.createLinearGradient(0,0,size,size);
  bgGrad.addColorStop(0, hexToRgba(paletteColors[0], 0.18));
  bgGrad.addColorStop(1, hexToRgba(paletteColors[3] || paletteColors[0], 0.18));
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0,0,size,size);
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0,0,size,size);

  const total = SHAPES.reduce((sum,s) => sum + (counts[s.id]||0), 0);
  if(total <= 0) return false;

  const totalDraws = 80;
  const seedBase = Date.now();
  let seed = seedBase % 100000;
  function rand(){ seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }

  SHAPES.forEach((shape, i) => {
    const ratio = (counts[shape.id]||0) / total;
    const n = counts[shape.id] > 0 ? Math.max(4, Math.round(ratio * totalDraws)) : 0;
    const color = paletteColors[i % paletteColors.length];
    for(let j=0;j<n;j++){
      const x = rand()*size;
      const y = rand()*size;
      const r = size*0.035 + rand()*size*0.09;
      const alpha = 0.5 + rand()*0.4;
      const rot = rand()*Math.PI*2;
      drawShape(ctx, shape.id, x, y, r, color, alpha, rot);
    }
  });
  return true;
}

/* ============================================================
   ART MODAL
   ============================================================ */
function ArtModal({ counts, profile, onClose, onSaveToGallery }){
  const canvasRef = useRef(null);
  const [paletteKey, setPaletteKey] = useState('pop');
  const [hasArt, setHasArt] = useState(false);
  const [shareMsg, setShareMsg] = useState('');

  const render = useCallback(() => {
    const canvas = canvasRef.current;
    if(!canvas) return;
    const ok = generateArt(canvas, counts, PALETTES[paletteKey].colors);
    setHasArt(ok);
  }, [counts, paletteKey]);

  useEffect(() => { render(); }, [render]);

  const totalCount = SHAPES.reduce((s,sh)=> s + (counts[sh.id]||0), 0);

  function handleSavePng(){
    const canvas = canvasRef.current;
    if(!canvas || !hasArt) return;
    try{
      canvas.toBlob((blob) => {
        if(!blob) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `katairo-art-${Date.now()}.png`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(()=>URL.revokeObjectURL(url), 2000);
      }, 'image/png');
    }catch(e){ setShareMsg('ほぞんできませんでした。もう一度 おためしください。'); }
  }

  function handleAddToGallery(){
    const canvas = canvasRef.current;
    if(!canvas || !hasArt) return;
    try{
      const thumb = document.createElement('canvas');
      thumb.width = 160; thumb.height = 160;
      thumb.getContext('2d').drawImage(canvas, 0, 0, 160, 160);
      const dataUrl = thumb.toDataURL('image/jpeg', 0.72);
      onSaveToGallery(dataUrl);
      setShareMsg('コレクションに ほぞんしました！');
    }catch(e){ setShareMsg('ほぞんできませんでした。'); }
  }

  async function handleShare(){
    const canvas = canvasRef.current;
    if(!canvas || !hasArt) return;
    const shareText = `#KataIroAtsume 形いろあつめで アートを つくったよ！`;
    try{
      if(navigator.share){
        canvas.toBlob(async (blob) => {
          try{
            if(blob && navigator.canShare && window.File){
              const file = new File([blob], 'katairo-art.png', { type:'image/png' });
              if(navigator.canShare({ files:[file] })){
                await navigator.share({ files:[file], text: shareText, title:'形いろあつめ' });
                setShareMsg('シェアしました！');
                return;
              }
            }
            await navigator.share({ text: shareText, title:'形いろあつめ' });
            setShareMsg('シェアしました！');
          }catch(err){
            /* user cancelled or share failed silently */
          }
        }, 'image/png');
      } else {
        try{
          await navigator.clipboard.writeText(shareText);
          setShareMsg('ハッシュタグを コピーしました！SNSに はりつけて シェアしてね📋');
        }catch(e){
          setShareMsg(shareText);
        }
      }
    }catch(e){
      setShareMsg('シェアできませんでした。');
    }
  }

  return (
    <div className="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="art-title" onClick={(e)=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal-sheet">
        <div className="modal-head">
          <h2 id="art-title" className="modal-title">🎨 {profile}の アート</h2>
          <button className="icon-btn" aria-label="とじる" onClick={onClose}>✕</button>
        </div>

        <div className="art-canvas-wrap">
          <canvas ref={canvasRef} width="600" height="600"></canvas>
        </div>

        {!hasArt && (
          <p style={{fontSize:'0.82rem', color:'var(--ink-soft)', textAlign:'center', marginBottom:'0.9rem'}}>
            形を まだ カウントしていません。まずは 形を タップして あつめてね🔍
          </p>
        )}

        <div className="field-group">
          <div className="field-label">🎨 カラーパレット</div>
          <div className="swatch-row">
            {Object.entries(PALETTES).map(([key, pal]) => (
              <button key={key} className={`swatch ${paletteKey===key ? 'active':''}`} onClick={()=>setPaletteKey(key)}>
                <span className="swatch-dots" aria-hidden="true">
                  {pal.colors.slice(0,4).map((c,i)=>(<i key={i} style={{background:c}}></i>))}
                </span>
                {pal.label}
              </button>
            ))}
          </div>
        </div>

        <div className="btn-row" style={{marginBottom:'0.6rem'}}>
          <button className="btn btn-secondary" onClick={render}>🔄 つくりなおす</button>
          <button className="btn btn-secondary" onClick={handleAddToGallery} disabled={!hasArt}>📚 コレクションに保存</button>
        </div>
        <div className="btn-row">
          <button className="btn btn-primary" onClick={handleSavePng} disabled={!hasArt}>💾 PNGで保存</button>
          <button className="btn btn-primary" onClick={handleShare} disabled={!hasArt}>📤 シェア</button>
        </div>

        {shareMsg && <p style={{fontSize:'0.78rem', color:'var(--maru-dark)', fontWeight:700, textAlign:'center', marginTop:'0.7rem'}}>{shareMsg}</p>}
      </div>
    </div>
  );
}

   ============================================================ */
function SosModal({ onClose }){
  const [step, setStep] = useState(0); // 0 lang, 1 category, 2 question, 3 result
  const [lang, setLang] = useState(null);
  const [category, setCategory] = useState(null);
  const [branch, setBranch] = useState(null); // 'yes' | 'no'

  function t(dict){ return dict[lang || 'ja']; }

  function reset(){ setStep(0); setLang(null); setCategory(null); setBranch(null); }

  function chooseLang(code){ setLang(code); setStep(1); }
  function chooseCategory(cat){ setCategory(cat); setStep(2); }
  function answer(ans){
    setBranch(ans === 'yes' ? 'yes' : 'no');
    setStep(3);
  }

  const title = step===0 ? SOS_UI.title.ja : `${SOS_UI.title.ja}${lang && lang!=='ja' ? ' / ' + SOS_UI.title[lang] : ''}`;

  return (
    <div className="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="sos-title" onClick={(e)=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal-sheet">
        <div className="modal-head">
          <h2 id="sos-title" className="modal-title">🆘 {title}</h2>
          <button className="icon-btn" aria-label="とじる" onClick={onClose}>✕</button>
        </div>

        {step > 0 && (
          <button className="step-back" onClick={() => setStep(s => Math.max(0, s-1))}>
            ← {SOS_UI.back.ja}{lang && lang!=='ja' ? ` / ${SOS_UI.back[lang]}` : ''}
          </button>
        )}

        {step === 0 && (
          <div>
            <p style={{fontWeight:700, marginBottom:'0.8rem'}}>{SOS_UI.pickLang.ja}</p>
            <div className="sos-lang-grid">
              {LANGS.map(l => (
                <button key={l.code} className="sos-lang-btn" onClick={()=>chooseLang(l.code)}>
                  <span className="flag" aria-hidden="true">{l.flag}</span>
                  <span className="lbl">{l.label}</span>
                </button>
              ))}
            </div>
          </div>
        )}

        {step === 1 && (
          <div>
            <p style={{fontWeight:700, marginBottom:'0.8rem'}}>
              {SOS_UI.pickCat.ja}{lang!=='ja' && <><br/><span style={{fontWeight:500, color:'var(--ink-soft)', fontSize:'0.82rem'}}>{SOS_UI.pickCat[lang]}</span></>}
            </p>
            <div className="sos-cat-grid">
              {SOS_CATEGORIES.map(cat => (
                <button key={cat.id} className="sos-cat-btn" onClick={()=>chooseCategory(cat)}>
                  <span className="em" aria-hidden="true">{cat.em}</span>
                  <span className="lbl">{cat.label.ja}</span>
                  {lang!=='ja' && <span className="lbl-sub">{cat.label[lang]}</span>}
                </button>
              ))}
            </div>
          </div>
        )}

        {step === 2 && category && (
          <div>
            <div className="sos-question-card">
              <span className="em" aria-hidden="true">{category.em}</span>
              <p>{category.question.ja}</p>
              {lang!=='ja' && <p className="sub">{category.question[lang]}</p>}
            </div>
            <div className="sos-answer-row">
              <button className="sos-answer-btn" onClick={()=>answer('yes')}>
                {SOS_UI.yes.ja}{lang!=='ja' ? ` / ${SOS_UI.yes[lang]}` : ''}
              </button>
              <button className="sos-answer-btn" onClick={()=>answer('no')}>
                {SOS_UI.no.ja}{lang!=='ja' ? ` / ${SOS_UI.no[lang]}` : ''}
              </button>
              <button className="sos-answer-btn" onClick={()=>answer('dunno')}>
                {SOS_UI.dunno.ja}{lang!=='ja' ? ` / ${SOS_UI.dunno[lang]}` : ''}
              </button>
            </div>
          </div>
        )}

        {step === 3 && category && branch && (
          <div>
            <div className="sos-result-card">
              <span className="badge">{category[branch].title.ja}</span>
              <div className="phrase-main">{category[branch].phrase.ja}</div>
              {lang!=='ja' && <div className="phrase-sub">{category[branch].phrase[lang]}</div>}
              <div className="note">
                {category[branch].note.ja}
                {lang!=='ja' && <><br/><br/>{category[branch].note[lang]}</>}
              </div>
            </div>
            <p style={{textAlign:'center', fontWeight:700, fontSize:'0.82rem', marginBottom:'1rem'}}>
              📱 {SOS_UI.showScreen.ja}{lang!=='ja' ? ` / ${SOS_UI.showScreen[lang]}` : ''}
            </p>

            <div className="field-label">☎️ {SOS_UI.emergency.ja}{lang!=='ja' ? ` / ${SOS_UI.emergency[lang]}` : ''}</div>
            <div className="emergency-row" style={{marginBottom:'1rem'}}>
              <div className="emergency-chip">
                <b>119</b>
                <span>{SOS_UI.ambulance.ja}{lang!=='ja' ? ` / ${SOS_UI.ambulance[lang]}` : ''}</span>
              </div>
              <div className="emergency-chip">
                <b>110</b>
                <span>{SOS_UI.police.ja}{lang!=='ja' ? ` / ${SOS_UI.police[lang]}` : ''}</span>
              </div>
            </div>

            <button className="btn btn-secondary" style={{width:'100%'}} onClick={reset}>
              🔁 {SOS_UI.again.ja}{lang!=='ja' ? ` / ${SOS_UI.again[lang]}` : ''}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   FACE-UP TOAST
   ============================================================ */
function FaceUpToast({ show, onClose }){
  return (
    <div className={`faceup-toast ${show ? 'show':''}`} role="status" aria-live="polite">
      <span aria-hidden="true" style={{fontSize:'1.3rem'}}>👀</span>
      <p>周囲を確認しましょう（画面から目を離して安全確認）</p>
      <button className="close-x" aria-label="とじる" onClick={onClose}>✕</button>
    </div>
  );
}

/* ============================================================
   FOOTER (required, verbatim)
   ============================================================ */
function AppFooter(){
  return (
    <footer style={{textAlign:'center', fontSize:'0.75rem', color:'#888', marginTop:'3rem', padding:'1rem 0.5rem', lineHeight:1.5}}>
      <p style={{marginBottom:'0.5rem'}}>【ご利用について】</p>
      <p style={{marginBottom:'0.5rem'}}>本アプリは、使用される方の毎日を楽しく、快適にする目的で開発されたWEBアプリケーションです。</p>
      <p style={{marginBottom:'0.5rem'}}>動作確認には万全を期しておりますが、端末環境やブラウザの仕様変更等に伴うデータ損失やトラブルについて開発者は一切の責任を負いかねます。</p>
      <p>ご意見・不具合のご報告は X（<a href="https://x.com/lblt_labo" target="_blank" rel="noopener" style={{color:'#666', textDecoration:'underline'}}>@lblt_labo</a>）までお願いいたします。</p>
    </footer>
  );
}

/* ============================================================
   MAIN APP
   ============================================================ */
function App(){
  const [profiles] = useState(DEFAULT_PROFILES);
  const [profile, setProfile] = useState(() => safeStorage.get('katairo_current_profile', DEFAULT_PROFILES[0]));
  const [tone, setTone] = useState(() => safeStorage.get('katairo_settings_tone', 'fuwafuwa'));
  const [timerMin, setTimerMin] = useState(() => safeStorage.get('katairo_settings_timer', 2));

  const [counts, setCounts] = useState(() => safeStorage.get(keyProfileCounts(profile), emptyCounts()));
  const [gallery, setGallery] = useState(() => safeStorage.get(keyProfileGallery(profile), []));

  const [showManner, setShowManner] = useState(() => !safeStorage.get('katairo_manner_seen', false));
  const [showSettings, setShowSettings] = useState(false);
  const [showArt, setShowArt] = useState(false);
  const [showGallery, setShowGallery] = useState(false);
  const [showSos, setShowSos] = useState(false);

  const [pulseId, setPulseId] = useState(null);
  const [toastVisible, setToastVisible] = useState(false);
  const toastTimeoutRef = useRef(null);

  // load per-profile data when profile changes
  useEffect(() => {
    setCounts(safeStorage.get(keyProfileCounts(profile), emptyCounts()));
    setGallery(safeStorage.get(keyProfileGallery(profile), []));
    safeStorage.set('katairo_current_profile', profile);
  }, [profile]);

  useEffect(() => { safeStorage.set(keyProfileCounts(profile), counts); }, [counts, profile]);
  useEffect(() => { safeStorage.set(keyProfileGallery(profile), gallery); }, [gallery, profile]);
  useEffect(() => { safeStorage.set('katairo_settings_tone', tone); }, [tone]);
  useEffect(() => { safeStorage.set('katairo_settings_timer', timerMin); }, [timerMin]);

  // face-up timer
  useEffect(() => {
    const intervalMs = Math.max(1, timerMin) * 60 * 1000;
    const id = setInterval(() => {
      setToastVisible(true);
      if(toastTimeoutRef.current) clearTimeout(toastTimeoutRef.current);
      toastTimeoutRef.current = setTimeout(() => setToastVisible(false), 6000);
    }, intervalMs);
    return () => { clearInterval(id); if(toastTimeoutRef.current) clearTimeout(toastTimeoutRef.current); };
  }, [timerMin]);

  function handleMannerAgree(){
    safeStorage.set('katairo_manner_seen', true);
    setShowManner(false);
  }

  function handleTap(shapeId){
    setCounts(c => ({ ...c, [shapeId]: (c[shapeId]||0) + 1 }));
    setPulseId(shapeId);
    setTimeout(() => setPulseId(p => p===shapeId ? null : p), 450);
  }

  function handleSaveArt(dataUrl){
    setGallery(g => {
      const next = [...g, { id: `${Date.now()}`, dataUrl, createdAt: Date.now() }];
      return next.slice(-24); // keep it bounded for storage size
    });
  }

  function handleDeleteArt(id){
    setGallery(g => g.filter(item => item.id !== id));
  }

  const total = SHAPES.reduce((s,sh) => s + (counts[sh.id]||0), 0);

  return (
    <div className="app-shell">
      <header className="app-header">
        <div className="brand-row">
          <div className="brand">
            <div className="brand-badge" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 100 100"><circle cx="35" cy="35" r="22" fill="#fff"/><polygon points="75,18 92,55 58,55" fill="#F2B33D"/></svg>
            </div>
            <div style={{minWidth:0}}>
              <div className="brand-title">形いろあつめ</div>
              <div className="brand-sub">街なかSOSつき</div>
            </div>
          </div>
          <div style={{display:'flex', gap:'0.4rem', alignItems:'center', flexShrink:0}}>
            <button className="icon-btn" aria-label="せってい" onClick={()=>setShowSettings(true)}>⚙️</button>
            <button className="sos-btn" onClick={()=>setShowSos(true)}>
              <span aria-hidden="true">🆘</span> SOS
            </button>
          </div>
        </div>

        <div className="profile-row" role="radiogroup" aria-label="プロフィールをえらぶ">
          {profiles.map(p => (
            <button
              key={p}
              className={`profile-pill ${profile===p ? 'active':''}`}
              role="radio"
              aria-checked={profile===p}
              onClick={()=>setProfile(p)}
            >
              {profile===p && <span className="check" aria-hidden="true">●</span>}
              {p}
            </button>
          ))}
        </div>
      </header>

      <div className="safety-strip">
        <span>📷カメラ・📍位置情報は 使用しません。あんぜんに あそぼうね！</span>
        <button onClick={()=>setShowSettings(true)}>せってい</button>
      </div>

      <main>
        <div className="greet">
          <div className="greet-name">{profile}さんの けいすう</div>
          <div className="greet-tone">ひょうじ：{TONE_MODES.find(t=>t.id===tone)?.label} ／ かおあげタイマー：{timerMin}分ごと</div>
        </div>

        <div className="shape-grid">
          {SHAPES.map(shape => (
            <div
              key={shape.id}
              className={`shape-tile ${pulseId===shape.id ? 'pulse':''}`}
              style={{ borderColor: pulseId===shape.id ? shape.color : undefined }}
              onClick={()=>handleTap(shape.id)}
              role="button"
              tabIndex={0}
              aria-label={`${SHAPE_ARIA[shape.id]}を かぞえる。いま ${counts[shape.id]||0}こ`}
              onKeyDown={(e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); handleTap(shape.id); } }}
            >
              <div className={`ring-burst ${pulseId===shape.id ? 'show':''}`} style={{borderColor: shape.color}}></div>
              <span className="count-chip" style={{background: shape.color}}>{counts[shape.id]||0}</span>
              <div className="icon-wrap"><ShapeIcon id={shape.id} color={shape.color} /></div>
              {tone !== 'sukkiri' && <div className="shape-label">{shape.labels[tone]}</div>}
              {tone === 'sukkiri' && <span className="sr-only">{SHAPE_ARIA[shape.id]}</span>}
            </div>
          ))}
        </div>

        <div className="stats-card">
          <div className="stats-total"><b>{total}</b><span>こ あつめたよ</span></div>
          <div className="btn-row">
            <button className="btn btn-primary" onClick={()=>setShowArt(true)}>🎨 アートを作る</button>
            <button className="btn btn-secondary" onClick={()=>setShowGallery(true)}>📚 コレクション</button>
          </div>
        </div>
      </main>

      <AppFooter />

      <FaceUpToast show={toastVisible} onClose={()=>setToastVisible(false)} />

      {showManner && <MannerDialog onAgree={handleMannerAgree} />}
      {showSettings && (
        <SettingsSheet
          tone={tone} setTone={setTone}
          timerMin={timerMin} setTimerMin={setTimerMin}
          onClose={()=>setShowSettings(false)}
        />
      )}
      {showArt && (
        <ArtModal
          counts={counts}
          profile={profile}
          onClose={()=>setShowArt(false)}
          onSaveToGallery={handleSaveArt}
        />
      )}
      {showGallery && (
        <GalleryModal
          gallery={gallery}
          profile={profile}
          onClose={()=>setShowGallery(false)}
          onDelete={handleDeleteArt}
        />
      )}
      {showSos && <SosModal onClose={()=>setShowSos(false)} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){ /* ignore in sandboxed preview */ });
    });
  }
</script>
</body>
</html>
